<!-- templates/qr_code.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect Lovense</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">

    <script>
        async function checkAuth() {
            try {
                const response = await fetch('/check-auth', {
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.authenticated) {
                    window.location.href = '/control';
                    return;
                }
            } catch (error) {
                console.error('Authentication check failed:', error);
            }

            setTimeout(checkAuth, 5000);
        }

        async function enableTestMode() {
            const button = document.getElementById('test-mode-button');
            const status = document.getElementById('status');

            button.disabled = true;
            button.innerText = 'Enabling Test Mode...';
            status.innerText = '';

            try {
                const response = await fetch('/skip-auth', {
                    method: 'GET',
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to enable test mode.');
                }

                status.innerText =
                    `Test mode enabled. Loaded ${data.nomi_count ?? 0} Nomi(s).`;

                window.location.href = data.redirect || '/control';

            } catch (error) {
                console.error(error);
                status.innerText = 'Test mode failed: ' + error.message;
                button.disabled = false;
                button.innerText = 'Use Test Mode';
            }
        }

        window.onload = checkAuth;
    </script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 w-full max-w-md text-center">

        <h2 class="text-xl font-bold mb-4">
            Connect Lovense
        </h2>

        <p class="text-gray-700 mb-4">
            Scan this QR code with the Lovense Remote app if you have a device connected.
        </p>

        <img src="{{ qr_url }}"
             alt="Lovense QR Code"
             class="mx-auto mb-6">

        <div class="border-t pt-5">

            <p class="text-gray-600 mb-3">
                No Lovense device available?
            </p>

            <button
                id="test-mode-button"
                onclick="enableTestMode()"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Use Test Mode
            </button>

            <p id="status" class="text-sm text-gray-600 mt-3"></p>

        </div>

    </div>

</body>
</html>
